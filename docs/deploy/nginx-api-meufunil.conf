# /etc/nginx/sites-available/meufunil-api  (symlink em sites-enabled). Só HTTP: o certbot
# acrescenta o bloco SSL: sudo certbot --nginx -d api-meufunil.freelaservicosapp.com.br
server {
    listen 80;
    listen [::]:80;
    server_name api-meufunil.freelaservicosapp.com.br;

    # multipart da API aceita até 100 MB (vídeo enviado no Estúdio)
    client_max_body_size 110M;

    location / {
        proxy_pass         http://127.0.0.1:3015;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        # SOBRESCREVE (não acrescenta): com TRUST_PROXY=1 a API lê este valor como o IP do cliente;
        # acrescentar deixaria o cliente forjar o IP e burlar o limite por IP (login, formulário público).
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # geração de imagem/vídeo e exportações podem levar alguns minutos numa chamada
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }
}
